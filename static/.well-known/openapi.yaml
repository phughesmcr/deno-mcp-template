openapi: 3.0.0
info:
  title: Deno MCP Template
  description: |
    A template for building MCP servers with Deno.

    The `/mcp` endpoint is a **stateless** MCP HTTP endpoint speaking protocol revision
    **2026-07-28** only. See the
    [MCP specification](https://modelcontextprotocol.io/specification/2026-07-28)
    for protocol details. There are no sessions and no `initialize` handshake; every request is
    self-contained. Clients using older protocol revisions receive an unsupported-version error.
    Responses may be `application/json` (including JSON-RPC envelopes) or `text/event-stream`
    (for example `subscriptions/listen`) depending on the request and server mode.
  version: 0.8.0
servers:
  - url: http://localhost:3001
    description: |
      Example base URL; the real host and port come from CLI flags and env (e.g. `--port`, `MCP_PORT`).

paths:
  /:
    get:
      summary: Server status (plain text)
      tags:
        - Status
      responses:
        "200":
          description: Human-readable line naming the app and pointing to `/llms.txt`.
          content:
            text/plain:
              schema:
                type: string
                example: "deno-mcp-template running. See `/llms.txt` for machine-readable docs."

  /mcp:
    post:
      summary: MCP over HTTP - POST (JSON-RPC requests and notifications)
      description: |
        The only supported method on this path. Send one JSON-RPC message per request, for example
        `tools/list` or `tools/call`; `subscriptions/listen` returns a long-lived event stream for
        change notifications. Multi-round tools return an `input_required` result with a signed
        `requestState`; the client retries the same request with its answers.

        Required headers: `MCP-Protocol-Version` (`2026-07-28`), `Mcp-Method` (must match the body's
        `method`), and `Mcp-Name` for methods that name a target (`tools/call` and `prompts/get`:
        `params.name`; `resources/read`: `params.uri`).

        When HTTP bearer auth is configured, send `Authorization: Bearer <token>` (see
        `components.securitySchemes`).
      tags:
        - MCP
      parameters:
        - $ref: "#/components/parameters/McpProtocolVersion"
        - $ref: "#/components/parameters/McpMethod"
        - $ref: "#/components/parameters/McpName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JSONRPCRequest"
      responses:
        "200":
          description: JSON-RPC result or error envelope, or an SSE stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONRPCEnvelope"
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream (for example `subscriptions/listen` notifications).
        "400":
          description: |
            Invalid JSON or empty body, missing or mismatched `MCP-Protocol-Version` / `Mcp-Method` /
            `Mcp-Name` headers, or an unsupported protocol version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONRPCError"
        "401":
          description: |
            Invalid or missing credentials (only when HTTP bearer auth is configured). The response
            carries `WWW-Authenticate: Bearer`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "405":
          description: "Method other than POST (GET and DELETE are not supported). The response carries `Allow: POST`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONRPCError"
        "403":
          description: |
            Host header rejected by DNS-rebinding protection (JSON-RPC error with `id: null`), or an
            `Origin` header that is not on the allowlist (JSON-RPC error without `id`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONRPCError"
        "413":
          description: "Request body too large (JSON-RPC error with `id: null`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONRPCError"
        "415":
          description: Content-Type is not `application/json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONRPCError"
        "429":
          description: Rate limit exceeded (only when rate limiting is enabled).
        "500":
          description: "Internal error (JSON-RPC error with `id: null`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONRPCError"

  /.well-known/llms.txt:
    get:
      summary: Machine-readable server summary for LLMs
      tags:
        - Well-known
      responses:
        "200":
          description: Plain-text llms.txt content.
          content:
            text/plain:
              schema:
                type: string

  /.well-known/openapi.yaml:
    get:
      summary: This OpenAPI document
      tags:
        - Well-known
      responses:
        "200":
          description: OpenAPI 3 YAML for this HTTP surface.
          content:
            application/yaml:
              schema:
                type: string
            text/yaml:
              schema:
                type: string

  /llms.txt:
    get:
      summary: Redirect to /.well-known/llms.txt
      tags:
        - Well-known
      responses:
        "302":
          description: Redirect to `/.well-known/llms.txt`.
          headers:
            Location:
              schema:
                type: string
                example: "/.well-known/llms.txt"

  /openapi.yaml:
    get:
      summary: Redirect to /.well-known/openapi.yaml
      tags:
        - Well-known
      responses:
        "302":
          description: Redirect to `/.well-known/openapi.yaml`.
          headers:
            Location:
              schema:
                type: string
                example: "/.well-known/openapi.yaml"

  /mcp-elicitation/confirm:
    get:
      summary: URL-mode elicitation — confirmation page (HTML)
      description: |
        Used by the `url-elicitation-demo` tool, and only present when `urlElicitation` is on in
        `src/mcp/serverDefinition.ts`. The query parameter must reference a valid pending elicitation;
        there is no session.
      tags:
        - MCP
      parameters:
        - name: elicitation
          in: query
          required: true
          description: Elicitation id UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: HTML form to confirm or cancel.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid parameters, or unknown or expired elicitation.
          content:
            text/html:
              schema:
                type: string

    post:
      summary: URL-mode elicitation — submit confirm or cancel
      description: Same availability as the GET route.
      tags:
        - MCP
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - elicitation
                - action
              properties:
                elicitation:
                  type: string
                  format: uuid
                action:
                  type: string
                  enum:
                    - confirm
                    - cancel
      responses:
        "200":
          description: HTML result page.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid form body, action, or elicitation state.
          content:
            text/html:
              schema:
                type: string

  /static/{path}:
    get:
      summary: Static assets under /static/
      description: Files from the server `static/` directory (e.g. built MCP app bundles).
      tags:
        - Static
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset bytes; content type depends on file.
        "404":
          description: Not found.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Applies only when the server is configured with an HTTP bearer token. Then `/mcp` requests
        must send `Authorization: Bearer <token>`. If no token is configured, these routes do not
        require authentication.

  parameters:
    McpProtocolVersion:
      name: mcp-protocol-version
      in: header
      required: true
      description: Protocol revision of the request. Only `2026-07-28` is supported.
      schema:
        type: string
        enum:
          - "2026-07-28"
    McpMethod:
      name: mcp-method
      in: header
      required: true
      description: JSON-RPC method of the request body (for example `tools/call`); must match the body.
      schema:
        type: string
        example: tools/call
    McpName:
      name: mcp-name
      in: header
      required: false
      description: |
        Required for `tools/call` and `prompts/get` (the `params.name`) and `resources/read`
        (the `params.uri`); must match the body. Omit for other methods.
      schema:
        type: string
        example: increment-counter

  schemas:
    JSONRPCRequest:
      type: object
      properties:
        jsonrpc:
          type: string
          description: JSON-RPC version
          example: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
          description: Request identifier
        method:
          type: string
          description: Method to call
          example: tools/list
        params:
          type: object
          description: Method parameters
      required:
        - jsonrpc
        - method

    JSONRPCSuccess:
      type: object
      properties:
        jsonrpc:
          type: string
          example: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        result:
          description: Method result (shape depends on MCP method).
      required:
        - jsonrpc
        - id
        - result

    JSONRPCError:
      type: object
      properties:
        jsonrpc:
          type: string
          example: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        error:
          type: object
          properties:
            code:
              type: integer
              description: Error code
            message:
              type: string
              description: Error message
            data:
              description: Additional error data
      required:
        - jsonrpc
        - error

    JSONRPCEnvelope:
      oneOf:
        - $ref: "#/components/schemas/JSONRPCSuccess"
        - $ref: "#/components/schemas/JSONRPCError"

    UnauthorizedError:
      type: object
      properties:
        error:
          type: string
          example: unauthorized
        message:
          type: string
          example: Invalid or missing credentials
      required:
        - error
        - message
