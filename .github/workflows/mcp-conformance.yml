name: MCP conformance

on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run conformance
        run: bash scripts/run-mcp-conformance.sh
