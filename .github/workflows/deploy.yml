name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prod:
        description: Deploy to production (leave unticked for a preview deployment)
        type: boolean
        default: false

# Deploys run one at a time and are never cancelled part way through.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8

      # Org slugs stay out of the log: it's public on public repositories. GitHub prints each
      # step's env, and repository variables aren't masked, so this has to run before any step
      # sets DENO_DEPLOY_ORG. The slugs come from the token, as printing the variable would leak it.
      - name: Mask org slugs
        id: mask
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DENO_DEPLOY_TOKEN" ]; then
            echo "::error::Missing DENO_DEPLOY_TOKEN secret."
            exit 1
          fi
          slugs=$(deno deploy whoami --json | jq -r '.orgs[].slug')
          if [ -z "$slugs" ]; then
            echo "::error::DENO_DEPLOY_TOKEN reaches no org, so the org slug can't be masked."
            exit 1
          fi
          for slug in $slugs; do
            echo "::add-mask::$slug"
          done

      - name: Check Deno Deploy access
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_ORG: ${{ vars.DENO_DEPLOY_ORG }}
          DENO_DEPLOY_APP: ${{ vars.DENO_DEPLOY_APP }}
        run: |
          if [ -z "$DENO_DEPLOY_ORG" ] || [ -z "$DENO_DEPLOY_APP" ]; then
            echo "::error::Missing DENO_DEPLOY_ORG / DENO_DEPLOY_APP repository variables."
            exit 1
          fi
          if ! deno deploy whoami --json | jq -e --arg org "$DENO_DEPLOY_ORG" '[.orgs[].slug] | index($org)' > /dev/null; then
            echo "::error::DENO_DEPLOY_TOKEN can't reach the org in DENO_DEPLOY_ORG. Check the slug, or use a token from that org."
            exit 1
          fi
          if ! deno deploy apps get --json --non-interactive --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP" > /dev/null; then
            echo "::error::App not found in the org. Create it once with: deno task deploy:setup --org <org> --app <app>"
            exit 1
          fi

      # No build step: `static/mcp-apps` is committed, and ci.yml fails if it differs from a fresh
      # build. `deno deploy` uploads this checkout as it is, and the server reads the file at runtime.
      - name: Deploy to Deno Deploy
        id: deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_ORG: ${{ vars.DENO_DEPLOY_ORG }}
          DENO_DEPLOY_APP: ${{ vars.DENO_DEPLOY_APP }}
          DEPLOY_TARGET: ${{ (github.event_name != 'workflow_dispatch' || inputs.prod) && '--prod' || '' }}
        run: |
          result=$(deno deploy --json --non-interactive --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP" $DEPLOY_TARGET)
          echo "$result" | jq -c '{status, revisionId}'
          echo "url=$(echo "$result" | jq -r '.timelines[0].domains[0]')" >> "$GITHUB_OUTPUT"

      # Deno Deploy only proves the server booted. Set the optional MCP_HTTP_BEARER_TOKEN
      # repository secret for a full check rather than stopping at the 401.
      - name: Smoke test the deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          MCP_HTTP_BEARER_TOKEN: ${{ secrets.MCP_HTTP_BEARER_TOKEN }}
        run: deno run --allow-net --allow-env=MCP_HTTP_BEARER_TOKEN scripts/smoke-deploy.ts "$DEPLOY_URL"

      # App logs land in the workflow log, which is public on public repositories.
      # Not if masking failed: this step's env would then print the org slug.
      - name: Show app logs
        if: failure() && steps.mask.outcome == 'success'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_ORG: ${{ vars.DENO_DEPLOY_ORG }}
          DENO_DEPLOY_APP: ${{ vars.DENO_DEPLOY_APP }}
        run: |
          timeout 60 deno deploy logs --once --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP" 2>&1 | grep -v Download | cut -c1-300 | tail -25 || true
