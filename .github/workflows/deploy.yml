name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prod:
        description: Deploy to production (untick for a preview deployment)
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Harden app settings (temporary, one-off)
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_ORG: ${{ vars.DENO_DEPLOY_ORG }}
          DENO_DEPLOY_APP: ${{ vars.DENO_DEPLOY_APP }}
          BEARER: ${{ secrets.TMP_MCP_HTTP_BEARER_TOKEN }}
          STATE_KEY: ${{ secrets.TMP_MCP_REQUEST_STATE_KEY }}
        run: |
          deno deploy env add --secret MCP_HTTP_BEARER_TOKEN "$BEARER" --non-interactive --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP"
          deno deploy env add --secret MCP_REQUEST_STATE_KEY "$STATE_KEY" --non-interactive --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP"
          deno deploy env add MCP_HTTP_RATE_LIMIT_UNKNOWN_MAX 1000 --non-interactive --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP"

      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_ORG: ${{ vars.DENO_DEPLOY_ORG }}
          DENO_DEPLOY_APP: ${{ vars.DENO_DEPLOY_APP }}
          DEPLOY_TARGET: ${{ (github.event_name != 'workflow_dispatch' || inputs.prod) && '--prod' || '' }}
        run: |
          if [ -z "$DENO_DEPLOY_TOKEN" ] || [ -z "$DENO_DEPLOY_ORG" ] || [ -z "$DENO_DEPLOY_APP" ]; then
            echo "Missing DENO_DEPLOY_TOKEN secret or DENO_DEPLOY_ORG / DENO_DEPLOY_APP repository variables."
            exit 1
          fi
          deno deploy --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP" $DEPLOY_TARGET

      - name: Read revision logs (temporary)
        if: failure()
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_ORG: ${{ vars.DENO_DEPLOY_ORG }}
          DENO_DEPLOY_APP: ${{ vars.DENO_DEPLOY_APP }}
        run: |
          deno deploy logs --once --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP" 2>&1 | grep -v Download | cut -c1-300 | tail -25 || true
